<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Andreea Sandu</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #020617;
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .bg-noise {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 10%, #1d4ed8 0%, transparent 40%),
                        radial-gradient(circle at 80% 30%, #0ea5e9 0%, transparent 40%);
            opacity: .15;
            filter: blur(80px);
            z-index: 0;
        }

        .gradient-text {
            background: linear-gradient(90deg,#60a5fa,#22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass {
            background: rgba(15,23,42,.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.06);
        }

        .btn-primary {
            background: linear-gradient(135deg,#2563eb,#38bdf8);
            transition: .3s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 0 35px rgba(56,189,248,.6);
            transform: translateY(-2px);
        }

        .contact-card {
            transition: .35s ease;
        }

        .contact-card:hover {
            transform: translateY(-10px);
            border-color: #3b82f6;
            box-shadow: 0 25px 60px rgba(37,99,235,.25);
        }
    </style>
</head>

<body>

<div class="bg-noise"></div>

<!-- NAV -->
<nav class="fixed w-full z-50 bg-slate-950/70 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
        <div class="text-xl font-semibold tracking-wide">
            Andreea<span class="text-blue-500">S.</span>
        </div>

        <div class="hidden md:flex gap-8 text-sm">
            <a href="index.html" class="hover:text-blue-400 transition">Home</a>
            <a href="services.html" class="hover:text-blue-400 transition">Services</a>
            <a href="projects.html" class="hover:text-blue-400 transition">Projects</a>
            <a href="contact.html" class="text-blue-400" aria-current="page">Contact</a>
        </div>
    </div>
</nav>

<!-- HERO -->
<section class="min-h-screen flex items-center justify-center pt-32 relative z-10">
    <div class="max-w-3xl mx-auto px-6 text-center">

        <h1 class="text-5xl md:text-6xl font-extrabold mb-6">
            Let's <span class="gradient-text">Work Together</span>
        </h1>

        <p class="text-slate-400 text-lg mb-16">
            If you need a Django system, workflow automation, or a custom internal platform,
            reach out directly by email.
        </p>

        <!-- EMAIL CARD -->
        <a href="mailto:sandu.andreea2212@gmail.com"
           class="contact-card glass p-12 rounded-3xl flex flex-col items-center text-center">

            <div class="text-5xl mb-6">✉</div>

            <h3 class="text-2xl font-bold mb-3">Email</h3>

            <p class="text-slate-400 mb-6">
                sandu.andreea2212@gmail.com
            </p>

            <span class="text-blue-400 font-semibold tracking-wide uppercase text-sm">
                Send a Message →
            </span>
        </a>

    </div>
</section>

<footer class="py-10 border-t border-slate-800 text-center text-slate-500 text-sm">
    © 2026 Andreea Sandu — Django Systems Development
</footer>

</body>
</html>
